<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Producto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"> <!-- Link a tus estilos -->
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Actualizar Producto</h2>
            <!-- Aquí puedes agregar una vista previa de la imagen si lo deseas -->
            <div class="image-container">
                {% if producto[5] %}
                <img src="{{ producto[5] }}" alt="Foto del producto" class="person-image">
                {% else %}
                <p>No hay foto disponible</p>
                {% endif %}
            </div>

            <form action="{{ url_for('actualizar', id=producto[0]) }}" method="POST" enctype="multipart/form-data">
                <input type="text" name="nombre" value="{{ producto[1] }}" placeholder="Nombre del producto" required>
                <input type="text" name="descripcion" value="{{ producto[2] }}" placeholder="Descripción" required>
                <input type="number" step="0.01" name="precio" value="{{ producto[3] }}" placeholder="Precio" required>
                <input type="number" name="cantidad" value="{{ producto[4] }}" placeholder="Cantidad en stock" required>

                <!-- Input para cargar una nueva imagen -->
                <input type="file" name="foto" accept="image/*" onchange="previewImage(event)">
                
                <!-- Sección para mostrar la vista previa de la imagen seleccionada -->
                <div id="image-preview">
                    <img id="image-preview-img" src="" alt="Vista previa de la imagen">
                </div>

                <!-- Botón para enviar el formulario -->
                <button type="submit">Actualizar Producto</button>
            </form>
        </div>
    </div>

    <!-- Script para mostrar una vista previa de la imagen seleccionada -->
    <script>
        function previewImage(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function() {
                const preview = document.getElementById('image-preview');
                const previewImg = document.getElementById('image-preview-img');
                preview.style.display = 'block';
                previewImg.src = reader.result;
            };
            if (file) {
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
