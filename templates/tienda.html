<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tienda.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <h1>Tienda</h1>
    
    <!-- Mostrar los productos -->
    <div class="productos">
        {% for producto in productos %}
        <div class="producto">
            <img src="{{ producto[5] }}" alt="Imagen Producto" width="100">
            <h3>{{ producto[1] }}</h3>
            <p>{{ producto[2] }}</p>
            <p>${{ producto[3] }}</p>

            <!-- Formulario para seleccionar la cantidad -->
            <form action="{{ url_for('añadir_al_carrito', id_producto=producto[0]) }}" method="POST">
                <label for="cantidad_{{ producto[0] }}">Cantidad:</label>
                <input type="number" id="cantidad_{{ producto[0] }}" name="cantidad" value="1" min="1" max="{{ producto[4] }}" required>
                <button type="submit">Añadir al carrito</button>
            </form>
        </div>
        {% endfor %}
    </div>
    
</body>
</html>
