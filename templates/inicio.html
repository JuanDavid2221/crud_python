<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inicio.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"> <!-- Para iconos -->
    <!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap JS y Popper (necesarios para el carrusel) -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
    
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar Lateral Fijo -->
        <header class="sidebar">
<nav>
    <ul>
        <li>
            <!-- Cambiar el href a la ruta de login -->
            <a href="{{ url_for('inicio') }}">
                <i class="fas fa-home"></i>
                <span>Inicio</span>
            </a>
            
        </li>
        <li>
            <a href="{{ url_for('crear') }}">
                <i class="fas fa-plus-circle"></i>
                <span>Agregar</span>
            </a>
        </li>
        <li>
            <a href="#">
                <i class="fas fa-edit"></i>
                <span>Actualizar</span>
            </a>
        </li>
        <li>
            <a href="#">
                <i class="fas fa-trash-alt"></i>
                <span>Eliminar</span>
            </a>
        </li>
    </ul>
</nav>
</header>

    <section class="init">

        <section class="bienvenido">
        <div class="trompa">
            <h1>Bienvenido a TrompiShop</h1>
            <p>Descubre productos unicos y reseñas autenticas de nuestros clientes trompones satisfechos</p>
        </div>
    </section>
    <section class="carrusel">
        <div id="carouselExample" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000"> <!-- 3000ms = 3 segundos -->
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="../static/uploads/luna.jpg" class="d-block w-100" alt="Imagen 1">
                </div>
                <div class="carousel-item">
                    <img src="../static/uploads/montana.jpg" class="d-block w-100" alt="Imagen 2">
                </div>
                <div class="carousel-item">
                    <img src="../static/uploads/morado.jpg" class="d-block w-100" alt="Imagen 3">
                </div>
            </div>
            <!-- Si no deseas los botones para cambiar las imágenes manualmente, puedes eliminarlos -->
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </section>
    
    
    </section>
</body>
</html>
